# wallpaper-rs configuration
# All fields shown here are optional except [image] path.

[image]
path = "/absolute/path/to/wallpaper.png"

[transition]
transition_type = "fade"
duration = 1.5
edge_smoothness = 0.3
transition_color = "#000000"

[transition.wipe]
direction = 0.0

[transition.disc]
center_x = 0.5
center_y = 0.5

[transition.stripes]
stripe_count = 12.0
angle = 30.0

[transition.honeycomb]
cell_size = 0.04
center_x = 0.5
center_y = 0.5

[resize]
strategy = "crop"
crop_gravity = "center"
fill_color = [0, 0, 0, 255]
filter = "lanczos3"
