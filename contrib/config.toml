# ouranos configuration
# Only `image` is required.

image = "/absolute/path/to/wallpaper.png"

[transition]
transition_type = "fade"
duration = 1.5
edge_smoothness = 0.3
transition_color = "#000000"

[resize]
strategy = "crop"
crop_gravity = "center"
fill_color = [0, 0, 0, 255]
filter = "lanczos3"
