[package]
name       = "ouranos"
version    = "26.3.0"
edition    = "2024"
license    = "MIT"
authors    = ["Ilham Putra Husada <hambosto@gmail.com>"]
repository = "https://github.com/hambosto/ouranos"

[dependencies]
anyhow                 = "1.0.104"
fast_image_resize      = "6.1.0"
figment                = { version = "0.10.19", features = ["toml"] }
hex_color              = { version = "3.0.0", features = ["serde"] }
image                  = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
serde                  = { version = "1.0.229", features = ["derive"] }
smithay-client-toolkit = "0.21.1"
tracing                = "0.1.44"
tracing-subscriber     = "0.3.23"
wayland-client         = "0.31.15"
xdg                    = "3.0.0"

[profile.release]
codegen-units = 1
lto           = "fat"
opt-level     = 3
panic         = "abort"
strip         = true

[lints.clippy]
chunks_exact_to_as_chunks = "allow"
